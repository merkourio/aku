[project]
name = "aku-transcribe"
version = "0.2.0"
description = "Aku: local call transcriber for Linux (PipeWire, whisper.cpp, pyannote)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "soundfile>=0.12",
    "onnxruntime>=1.18",
    "httpx>=0.27",
    "openai>=1.50",
    "keyring>=25",
    "dbus-fast>=2.20",
    "pyannote.audio>=4.0",
    "torch>=2.8",
    "torchaudio>=2.8",
    "scikit-learn>=1.5",
]

[project.scripts]
aku = "aku.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aku"]
artifacts = ["aku/static/**"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
