name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    if: github.event.repository.private == false
    name: Backend (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python }}
      - working-directory: backend
        run: uv sync --frozen --group dev
      - working-directory: backend
        run: uv run --frozen pytest -q
  frontend:
    if: github.event.repository.private == false
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-fund --no-audit && npm test && npm run build
      - run: python3 scripts/frontend-notices.py --check && python3 scripts/check-public.py && python3 scripts/test-installer.py
      - run: bash -n scripts/*.sh
  secrets:
    if: github.event.repository.private == false
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks 8.30.1 (verified official binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 -R gitleaks/gitleaks -D "$RUNNER_TEMP/gitleaks" -p gitleaks_8.30.1_linux_x64.tar.gz -p gitleaks_8.30.1_checksums.txt
          (cd "$RUNNER_TEMP/gitleaks" && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c - && tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks)
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --log-opts=--all --config .gitleaks.toml
